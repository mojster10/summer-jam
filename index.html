<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔊 Soundboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>🔊 Soundboard</h1>
    <p class="subtitle">Klikni na gumb ali pritisni tipke <kbd>1</kbd>–<kbd>9</kbd></p>
  </header>

  <main>
    <div class="board" id="board">
      <!-- Gumbi se generirajo dinamično iz script.js -->
    </div>
  </main>

  <footer class="footer">
    <p>Zvoki so generirani v realnem času z Web Audio API — brez zunanjih datotek.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
